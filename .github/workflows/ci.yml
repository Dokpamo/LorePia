name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android-dependency-integrity:
    name: Android dependency integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      NDK_HOME: ${{ github.workspace }}/.android-sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test Android preparation path safety
        run: python3 -m unittest scripts/test_prepare_tauri_android_gradle.py

      - name: Verify GitHub workflow trust boundaries
        run: |
          python3 scripts/check_github_workflow_security.py
          python3 -m unittest \
            scripts/test_stage_release_candidate.py \
            scripts/test_package_linux_release_candidate.py \
            scripts/test_write_release_checksums.py

      - name: Verify committed Gradle integrity controls
        run: python3 scripts/check_android_dependency_integrity.py

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 14742923
          packages: ""

      - name: Verify Android SDK manager
        run: |
          command -v sdkmanager
          sdkmanager --version

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json

      - name: Install Tauri CLI dependencies
        working-directory: apps/lorepia
        run: npm ci

      - name: Install pinned Android SDK components
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.2.12479018"

      - name: Initialize Tauri Android project
        working-directory: apps/lorepia
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Prepare ignored Tauri Android Gradle inputs
        run: python3 scripts/prepare_tauri_android_gradle.py

      - name: Resolve app buildscript and release dependencies with strict locks
        working-directory: apps/lorepia/src-tauri/gen/android
        run: |
          ./gradlew --no-daemon --console=plain --dependency-verification strict \
            buildEnvironment
          ./gradlew --no-daemon --console=plain --dependency-verification strict \
            :app:dependencies --configuration arm64ReleaseRuntimeClasspath
          ./gradlew --no-daemon --console=plain --dependency-verification strict \
            :tauri-plugin-lorepia-platform:dependencies \
            --configuration releaseRuntimeClasspath
          ./gradlew --no-daemon --console=plain --dependency-verification strict \
            :tauri-android:dependencies --configuration releaseRuntimeClasspath

      - name: Resolve standalone plugin dependencies with strict verification and locks
        working-directory: plugins/lorepia-platform/android
        run: |
          WRAPPER="${{ github.workspace }}/apps/lorepia/src-tauri/gen/android/gradlew"
          PLUGIN_ROOT="${{ github.workspace }}/plugins/lorepia-platform/android"
          "$WRAPPER" -p "$PLUGIN_ROOT" --no-daemon --console=plain \
            --dependency-verification strict dependencies \
            --configuration releaseRuntimeClasspath
          "$WRAPPER" -p "$PLUGIN_ROOT" --no-daemon --console=plain \
            --dependency-verification strict :tauri-android:dependencies \
            --configuration releaseRuntimeClasspath

  ios-simulator:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/lorepia
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json

      - name: Verify Apple simulator toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          pod --version

      # rust-toolchain.toml pins the compiler; this is the Apple Silicon
      # simulator target used by GitHub's arm64 macOS runner.
      - name: Install pinned Rust simulator target
        run: |
          rustc --version
          rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Tauri CLI dependencies
        run: npm ci

      - name: Initialize Tauri iOS dependencies
        run: npm run tauri -- ios init --ci --skip-targets-install

      # Tauri's generated Xcode build phase calls `tauri ios xcode-script`,
      # which reads build options from a server owned by the parent CLI. Keep
      # that context alive, but let xcodebuild perform a non-archive simulator
      # build so CI never enters the distribution-signing path.
      - name: Build unsigned iOS simulator app with Xcode
        run: |
          set -euo pipefail

          context_log="$RUNNER_TEMP/tauri-ios-xcode-context.log"
          shim_dir="$RUNNER_TEMP/tauri-ios-ci-bin"
          mkdir -p "$shim_dir"
          ln -s /usr/bin/true "$shim_dir/open"

          PATH="$shim_dir:$PATH" npm run tauri -- ios build --open --ci --debug -v \
            --target aarch64-sim --no-sign \
            --config src-tauri/tauri.release.conf.json \
            >"$context_log" 2>&1 &
          context_pid=$!
          cleanup() {
            kill "$context_pid" 2>/dev/null || true
            wait "$context_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          context_ready=false
          for _ in {1..60}; do
            if grep -q "Opening Xcode" "$context_log"; then
              context_ready=true
              break
            fi
            if ! kill -0 "$context_pid" 2>/dev/null; then
              cat "$context_log"
              wait "$context_pid"
            fi
            sleep 1
          done
          if [[ "$context_ready" != true ]]; then
            cat "$context_log"
            echo "Tauri Xcode build context did not become ready" >&2
            exit 1
          fi

          xcodebuild \
            -project src-tauri/gen/apple/lorepia-tauri.xcodeproj \
            -scheme lorepia-tauri_iOS \
            -configuration debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Linux needs the webkit stack for the Tauri crate to build.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      # rust-toolchain.toml pins the exact version and components.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Verify generated IPC command registries
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m unittest scripts/test_generate_ipc_commands.py
          python3 scripts/generate_ipc_commands.py --check

      - name: Verify source-size and dependency architecture ratchets
        if: matrix.os == 'ubuntu-latest'
        env:
          SOURCE_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest \
            scripts/test_check_ai_context_map.py \
            scripts/test_check_source_architecture.py \
            scripts/test_report_refactoring_baseline.py
          python3 scripts/check_ai_context_map.py
          python3 scripts/check_source_architecture.py --base-ref "$SOURCE_RATCHET_BASE"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Windows platform regression tests
        if: matrix.os == 'windows-latest'
        run: cargo test -p tauri-plugin-lorepia-platform --lib

      - name: Test
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lorepia
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      - name: Verify inline translation-debt ratchet
        env:
          I18N_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ../../scripts/check_i18n_literal_baseline.py --base-ref "$I18N_RATCHET_BASE"

      # format:check + lint + typecheck
      - run: npm run check

      - run: npm run test
