name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security-gate:
    name: Release dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json

      - run: npm ci
        working-directory: apps/lorepia

      - name: Reject high or critical npm advisories
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/lorepia

  official-release-policy:
    name: Protected signing required
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsigned official release
        run: |
          echo "Official tag releases are disabled until protected macOS, Windows, and Linux signing jobs verify exact candidate digests." >&2
          exit 1

  bundle:
    name: Unsigned candidate (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: security-gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: npm ci
        working-directory: apps/lorepia

      - name: Bundle
        working-directory: apps/lorepia
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Stage final candidate artifacts
        run: >-
          python scripts/stage_release_candidate.py
          target/release/bundle
          target/release/candidate
          ${{ runner.os }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/release/candidate
          format: spdx-json
          output-file: target/release/candidate/lorepia-${{ matrix.os }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write candidate checksums
        run: python scripts/write_release_checksums.py target/release/candidate

      - name: Attest candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: target/release/candidate/SHA256SUMS

      - name: Attest candidate SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: target/release/candidate/SHA256SUMS
          sbom-path: target/release/candidate/lorepia-${{ matrix.os }}.spdx.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lorepia-UNSIGNED-candidate-${{ matrix.os }}
          path: |
            target/release/candidate/**/*
          if-no-files-found: error
          retention-days: 14
