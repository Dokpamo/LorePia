name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  official-release-policy:
    name: Protected signing required
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsigned official release
        run: |
          echo "Official tag releases are disabled until protected macOS, Windows, and Linux signing jobs verify exact candidate digests." >&2
          exit 1

  bundle:
    name: Unsigned candidate (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: npm ci
        working-directory: apps/lorepia

      - name: Bundle
        working-directory: apps/lorepia
        run: npm run tauri build -- --config tauri.release.conf.json

      - name: Write candidate checksums
        run: python scripts/write_release_checksums.py target/release/bundle

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lorepia-UNSIGNED-candidate-${{ matrix.os }}
          path: |
            target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
