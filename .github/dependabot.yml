version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Seoul

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Seoul

  - package-ecosystem: npm
    directory: /apps/lorepia
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Seoul

  - package-ecosystem: gradle
    directory: /apps/lorepia/src-tauri/gen/android
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Seoul

  - package-ecosystem: gradle
    directory: /plugins/lorepia-platform/android
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Seoul
