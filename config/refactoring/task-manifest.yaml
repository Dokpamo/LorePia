    "Use the Rust and Node versions pinned by rust-toolchain.toml and .node-version.",
    "Start each task from the latest green main and record HEAD, merge-base, worktree state, symbols, invariants, tests, expected size delta, and semantic risks before editing.",
    "Do not change behavior, public contracts, schema, serialization, errors, IPC names, security boundaries, or deterministic ordering unless the task explicitly authorizes that exact change.",
    "Do not add or upgrade dependencies in a refactoring task.",
    "Existing source-size and context baselines may only shrink; do not add a giant-file exception to hide extraction output.",
