    "validation_ledger_resolution": "B-E path moves may update config/ai-context-map.json; frontend moves may migrate only existing config/i18n-literal-baseline.json entries. A commit that lowers a size, public-API, or context ratchet may regenerate both refactoring report snapshots."
  },
