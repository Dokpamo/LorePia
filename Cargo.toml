[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/orchestration",
  "crates/content",
  "crates/storage",
  "crates/providers",
  "crates/chat",
  "crates/core",
  "crates/shell-api",
  "plugins/lorepia-platform",
  "apps/lorepia/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
psl = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1.11"
ring = "0.17"
rusqlite = { version = "0.37", features = ["backup", "bundled", "functions"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.17", features = ["v4", "v5", "serde"] }
zip = { version = "4.3", default-features = false, features = ["deflate"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
