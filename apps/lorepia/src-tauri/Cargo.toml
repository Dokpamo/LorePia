[package]
name = "lorepia-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "lorepia_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lorepia"
path = "src/main.rs"
doc = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
lorepia-shell-api = { path = "../../../crates/shell-api" }
serde.workspace = true
sha2.workspace = true
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-lorepia-platform = { path = "../../../plugins/lorepia-platform", features = [
  "wry",
] }
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
lorepia-shell-api = { path = "../../../crates/shell-api", features = ["test-support"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
